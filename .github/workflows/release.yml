name: Public Alpha release

on:
  push:
    tags:
      - "v*-alpha.*"

permissions:
  contents: read

concurrency:
  group: public-alpha-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Select the workspace Rust toolchain
        run: |
          rustup toolchain install 1.85.0 --profile minimal
          rustup default 1.85.0

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Check tag and release versions
        run: bun run release:check -- --version "$GITHUB_REF_NAME"

      - name: Type check
        run: bun run typecheck

      - name: Run TypeScript tests
        run: bun run test:ts

      - name: Run release packaging tests
        run: bun run test:release

      - name: Run Rust tests
        run: bun run test:rust

  build-native:
    name: Build ${{ matrix.target }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            target: windows-x64
            package_dir: capybara-code-win32-x64
            macos_deployment_target: ""
          - runner: macos-15-intel
            target: darwin-x64
            package_dir: capybara-code-darwin-x64
            macos_deployment_target: "13.0"
          - runner: macos-15
            target: darwin-arm64
            package_dir: capybara-code-darwin-arm64
            macos_deployment_target: "13.0"
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_deployment_target }}
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Select the workspace Rust toolchain
        run: |
          rustup toolchain install 1.85.0 --profile minimal
          rustup default 1.85.0

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Build Rust runtime
        run: bun run build:runtime

      - name: Build standalone Capybara Code
        run: bun run build:capy -- --target ${{ matrix.target }}

      - name: Assemble native npm package
        run: bun run release:package -- --target ${{ matrix.target }}

      - name: Build independent release archive
        run: bun run release:archive -- --target ${{ matrix.target }}

      - name: Smoke test packaged binary and relative sidecar path
        run: bun run release:smoke -- --target ${{ matrix.target }}

      - name: Pack native npm tarball before artifact transfer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/npm-tarballs
          npm pack "./dist/npm/${{ matrix.package_dir }}" --pack-destination dist/npm-tarballs

      - name: Upload immutable npm tarball and native archive
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.target }}
          path: |
            dist/npm-tarballs/
            dist/release/
          if-no-files-found: error
          retention-days: 7

  # The oldest glibc available at link time becomes the binary's ABI floor.
  # Build and execute the complete Linux package on Ubuntu 20.04 so a newer
  # GitHub runner cannot silently raise the documented GLIBC 2.31 requirement.
  build-linux:
    name: Build linux-x64 (glibc 2.31)
    needs: validate
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:20.04
    env:
      CBC_RELEASE_GLIBC_BASELINE: "2.31"
    steps:
      - name: Install Linux build prerequisites
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            binutils \
            build-essential \
            ca-certificates \
            curl \
            git \
            pkg-config \
            unzip \
            xz-utils

      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Install the pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain 1.85.0
          echo "${HOME}/.cargo/bin" >> "${GITHUB_PATH}"

      - name: Verify Linux compatibility build environment
        run: test "$(getconf GNU_LIBC_VERSION)" = "glibc 2.31"

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Build Rust runtime and verify GLIBC symbol versions
        run: bun run build:runtime

      - name: Build standalone Capybara Code
        run: bun run build:capy -- --target linux-x64

      - name: Assemble native npm package
        run: bun run release:package -- --target linux-x64

      - name: Build independent release archive
        run: bun run release:archive -- --target linux-x64

      - name: Smoke test binary, sidecar, and runtime.initialize handshake
        run: bun run release:smoke -- --target linux-x64

      - name: Pack native npm tarball before artifact transfer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/npm-tarballs
          npm pack "./dist/npm/capybara-code-linux-x64" --pack-destination dist/npm-tarballs

      - name: Upload immutable npm tarball and native archive
        uses: actions/upload-artifact@v4
        with:
          name: native-linux-x64
          path: |
            dist/npm-tarballs/
            dist/release/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish npm packages and GitHub prerelease
    needs: [validate, build-native, build-linux]
    runs-on: ubuntu-24.04
    environment:
      name: npm-publish
      url: https://www.npmjs.com/package/capybara-code
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Confirm that the repository is public for trusted publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh repo view "${GITHUB_REPOSITORY}" --json isPrivate --jq '.isPrivate')" = false

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Download native artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: native-*
          merge-multiple: true
          path: dist

      - name: Assemble and pack root launcher package
        shell: bash
        run: |
          set -euo pipefail
          bun run release:package -- --launcher --out dist
          mkdir -p dist/npm-tarballs
          npm pack ./dist/npm/capybara-code --pack-destination dist/npm-tarballs

      - name: Verify npm tarballs and POSIX executable modes
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          package_tarballs=(
            "./dist/npm-tarballs/ilbie-capybara-code-win32-x64-${version}.tgz"
            "./dist/npm-tarballs/ilbie-capybara-code-darwin-x64-${version}.tgz"
            "./dist/npm-tarballs/ilbie-capybara-code-darwin-arm64-${version}.tgz"
            "./dist/npm-tarballs/ilbie-capybara-code-linux-x64-${version}.tgz"
            "./dist/npm-tarballs/capybara-code-${version}.tgz"
          )
          for package_tarball in "${package_tarballs[@]}"; do
            test -f "${package_tarball}"
            npm publish "${package_tarball}" --dry-run --tag alpha --access public
          done

          posix_tarballs=(
            "./dist/npm-tarballs/ilbie-capybara-code-darwin-x64-${version}.tgz"
            "./dist/npm-tarballs/ilbie-capybara-code-darwin-arm64-${version}.tgz"
            "./dist/npm-tarballs/ilbie-capybara-code-linux-x64-${version}.tgz"
          )
          for package_tarball in "${posix_tarballs[@]}"; do
            verify_dir="$(mktemp -d)"
            tar -xzf "${package_tarball}" -C "${verify_dir}"
            test -x "${verify_dir}/package/bin/capy"
            test -x "${verify_dir}/package/libexec/cbc-runtime"
            rm -rf "${verify_dir}"
          done

      - name: Publish npm packages with npm trusted publishing
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          package_tarballs=(
            "./dist/npm-tarballs/ilbie-capybara-code-win32-x64-${version}.tgz"
            "./dist/npm-tarballs/ilbie-capybara-code-darwin-x64-${version}.tgz"
            "./dist/npm-tarballs/ilbie-capybara-code-darwin-arm64-${version}.tgz"
            "./dist/npm-tarballs/ilbie-capybara-code-linux-x64-${version}.tgz"
            "./dist/npm-tarballs/capybara-code-${version}.tgz"
          )
          for package_tarball in "${package_tarballs[@]}"; do
            npm publish "${package_tarball}" --tag alpha --access public --provenance
          done

      - name: Write GitHub Release SHA-256 manifest
        run: bun run release:checksums -- --dir dist/release

      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/release/* \
            --verify-tag \
            --prerelease \
            --title "Capybara Code $GITHUB_REF_NAME — Public Alpha" \
            --notes "Public Alpha: usable, but not dependable for mission-critical workflows. Verify downloaded archives with SHA256SUMS.txt."
