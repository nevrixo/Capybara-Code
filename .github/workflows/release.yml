name: Public Alpha release

on:
  push:
    tags:
      - "v*-alpha.*"

permissions:
  contents: read

concurrency:
  group: public-alpha-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Select the workspace Rust toolchain
        run: |
          rustup toolchain install 1.85.0 --profile minimal
          rustup default 1.85.0

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Check tag and release versions
        run: bun run release:check -- --version "$GITHUB_REF_NAME"

      - name: Type check
        run: bun run typecheck

      - name: Run TypeScript tests
        run: bun run test:ts

      - name: Run release packaging tests
        run: bun run test:release

      - name: Run Rust tests
        run: bun run test:rust

  build-native:
    name: Build ${{ matrix.target }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            target: windows-x64
          - runner: macos-15-intel
            target: darwin-x64
          - runner: macos-15
            target: darwin-arm64
          - runner: ubuntu-24.04
            target: linux-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Select the workspace Rust toolchain
        run: |
          rustup toolchain install 1.85.0 --profile minimal
          rustup default 1.85.0

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Build Rust runtime
        run: bun run build:runtime

      - name: Build standalone Capybara Code
        run: bun run build:capy -- --target ${{ matrix.target }}

      - name: Assemble native npm package
        run: bun run release:package -- --target ${{ matrix.target }}

      - name: Build independent release archive
        run: bun run release:archive -- --target ${{ matrix.target }}

      - name: Smoke test packaged binary and relative sidecar path
        run: bun run release:smoke -- --target ${{ matrix.target }}

      - name: Upload native package and archive
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.target }}
          path: |
            dist/npm/
            dist/release/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish npm packages and GitHub prerelease
    needs: [validate, build-native]
    runs-on: ubuntu-24.04
    environment:
      name: npm-publish
      url: https://www.npmjs.com/package/capybara-code
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Confirm that the repository is public for trusted publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh repo view "${GITHUB_REPOSITORY}" --json isPrivate --jq '.isPrivate')" = false

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Download native artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: native-*
          merge-multiple: true
          path: dist

      - name: Assemble root launcher package
        run: bun run release:package -- --launcher --out dist

      - name: Verify packed file lists
        shell: bash
        run: |
          set -euo pipefail
          package_dirs=(
            capybara-code-win32-x64
            capybara-code-darwin-x64
            capybara-code-darwin-arm64
            capybara-code-linux-x64
            capybara-code
          )
          for package_dir in "${package_dirs[@]}"; do
            npm pack --dry-run "./dist/npm/${package_dir}"
          done

      - name: Publish v0.1.0-alpha.3 with protected bootstrap token
        if: github.ref_name == 'v0.1.0-alpha.3'
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${NODE_AUTH_TOKEN:-}" || { echo "NPM_BOOTSTRAP_TOKEN is required for alpha.3"; exit 1; }
          package_dirs=(
            capybara-code-win32-x64
            capybara-code-darwin-x64
            capybara-code-darwin-arm64
            capybara-code-linux-x64
            capybara-code
          )
          for package_dir in "${package_dirs[@]}"; do
            npm publish "./dist/npm/${package_dir}" --tag alpha --access public
          done

      - name: Publish later alphas with npm trusted publishing
        if: github.ref_name != 'v0.1.0-alpha.3'
        shell: bash
        run: |
          set -euo pipefail
          package_dirs=(
            capybara-code-win32-x64
            capybara-code-darwin-x64
            capybara-code-darwin-arm64
            capybara-code-linux-x64
            capybara-code
          )
          for package_dir in "${package_dirs[@]}"; do
            npm publish "./dist/npm/${package_dir}" --tag alpha --access public --provenance
          done

      - name: Write GitHub Release SHA-256 manifest
        run: bun run release:checksums -- --dir dist/release

      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/release/* \
            --verify-tag \
            --prerelease \
            --title "Capybara Code $GITHUB_REF_NAME — Public Alpha" \
            --notes "Public Alpha: usable, but not dependable for mission-critical workflows. Verify downloaded archives with SHA256SUMS.txt."
